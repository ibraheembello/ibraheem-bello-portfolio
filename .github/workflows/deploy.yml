name: Deploy Portfolio to EC2

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci

      - name: Run server tests
        working-directory: ./server
        run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 20m
          script: |
            set -e
            cd ~/ibraheem-bello-portfolio
            git pull origin main
            # 1 GB instance: cap Node heap and lean on swap so the client build doesn't OOM
            cd client && npm ci && NODE_OPTIONS=--max-old-space-size=1536 npm run build && cd ..
            cd server && npm ci && npm run build && cd ..
            chmod -R 755 client/dist
            pm2 restart portfolio-api --update-env || pm2 start ecosystem.config.js
            pm2 save
